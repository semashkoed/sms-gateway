name: CI

on:
  push:
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sms
          POSTGRES_PASSWORD: sms
          POSTGRES_DB: sms
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sms" --health-interval 2s --health-retries 30
    env:
      TEST_PG_DSN: postgresql://sms:sms@localhost:5432/sms
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Tests
        run: pytest -v

  docker-build:
    needs: lint-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t sms-gateway:${{ github.sha }} .
