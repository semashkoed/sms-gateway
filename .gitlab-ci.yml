# Тот же пайплайн для GitLab CI (основной CI проекта — GitHub Actions)
stages: [lint, test, build]

default:
  image: python:3.12-slim
  before_script:
    - pip install -r requirements.txt -r requirements-dev.txt

lint:
  stage: lint
  script:
    - ruff check .
    - ruff format --check .

test:
  stage: test
  services:
    - name: postgres:16-alpine
      alias: postgres
  variables:
    POSTGRES_USER: sms
    POSTGRES_PASSWORD: sms
    POSTGRES_DB: sms
    TEST_PG_DSN: postgresql://sms:sms@postgres:5432/sms
  script:
    - pytest -v

build:
  stage: build
  image: docker:27
  services: [docker:27-dind]
  before_script: []
  script:
    - docker build -t "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA" .
